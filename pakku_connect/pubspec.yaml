name: pakku_connect
description: Call control and notification bridge between Android and macOS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  web_socket_channel: ^3.0.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  flutter_secure_storage: ^11.0.0
  crypto: ^3.0.6
  shared_preferences: ^2.3.4
  network_info_plus: ^8.2.1
  intl: ^0.20.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.12
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - certs/device.der
    - assets/images/app_logo.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  macos:
    generate: true
  image_path: "assets/images/app_logo.png"
